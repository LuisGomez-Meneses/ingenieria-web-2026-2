<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soporte Web | Registrar contacto</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <a class="marca" href="/">Soporte Web</a>
    <nav aria-label="Navegación principal">
      <a href="/">Inicio</a>
      <a href="/acerca">Acerca de</a>
      <a href="/servicios">Servicios</a>
      <a href="/contacto">Contacto</a>
      <a href="/contactos">Consultar contactos</a>
    </nav>
  </header>
  <main>
    <section class="encabezado-pagina">
      <p class="etiqueta">Contacto</p>
      <h1>Registrar contacto</h1>
      <p>Completa los datos y escribe tu mensaje.</p>
    </section>
    <section class="panel">
      <form action="/contacto" method="POST">
        <label for="nombre">Nombre completo
          <input type="text" id="nombre" name="nombre" required autocomplete="name">
        </label>
        <label for="correo">Correo electrónico
          <input type="email" id="correo" name="correo" required autocomplete="email">
        </label>
        <label for="mensaje">Mensaje
          <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
        </label>
        <div class="acciones">
          <button type="submit">Guardar contacto</button>
          <a class="boton secundario" href="/">Volver al inicio</a>
        </div>
      </form>
    </section>
  </main>
  <footer>Ingeniería Web · Demostración académica</footer>
</body>
</html>
