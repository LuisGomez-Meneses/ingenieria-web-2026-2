# Documentación de la API de contactos del Laboratorio 06.
# Guardar junto a server_rutas.js. Este archivo describe la API;
# el código que atiende las peticiones está en server_rutas.js.
openapi: 3.1.0
info:
  title: API de contactos - Laboratorio 06
  version: 1.0.0
  description: >-
    Consulta de contactos almacenados en SQLite. En la parte A, el servidor
    ofrece esta operación. En la parte B, contactos.html la consume mediante
    fetch() y muestra id, nombre y correo en una tabla.
servers:
  - url: http://localhost:3000
    description: Servidor local del laboratorio
paths:
  /api/contactos:
    get:
      summary: Consultar los contactos registrados
      operationId: consultarContactos
      description: >-
        Devuelve todos los contactos ordenados por id ascendente. No requiere
        parámetros ni cuerpo de solicitud. Si no hay registros, devuelve [].
        La respuesta incluye el mensaje aunque la tabla de la parte B solo
        muestra id, nombre y correo.
      responses:
        '200':
          description: Consulta exitosa. Lista de contactos en JSON.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - nombre
                    - correo
                    - mensaje
                  properties:
                    id:
                      type: integer
                      description: Identificador del contacto
                    nombre:
                      type: string
                    correo:
                      type: string
                    mensaje:
                      type: string
              examples:
                conContactos:
                  summary: Lista con un contacto ficticio
                  value:
                    - id: 1
                      nombre: Ana
                      correo: ana@example.com
                      mensaje: Quiero información del curso.
                sinContactos:
                  summary: No hay contactos registrados
                  value: []
        '500':
          description: Error interno al consultar los contactos.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
              example:
                error: No fue posible consultar los contactos
